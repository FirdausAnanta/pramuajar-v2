function syncBuilder(){if(!builder)return;const val=id=>$('#'+id)?.value;for(const [id,key] of [['build-chapter','chapter'],['build-topic','topic'],['build-source','source'],['build-approach','approach']])if(val(id)!==undefined)builder[key]=val(id);for(const[id,key]of[['build-jp','jp'],['build-duration','duration']])if(val(id)!==undefined)builder[key]=Number(val(id));if(val('build-count')!==undefined){if(builder.scope==='meeting')builder.first=Number(val('build-count'));else builder.count=Number(val('build-count'))}for(const key of ['base','middle','advanced'])if(val('needs-'+key)!==undefined)builder.needs[key]=val('needs-'+key);for(const key of ['audio','visual','reflection'])if($('#build-'+key))builder[key]=$('#build-'+key).checked;if($('[name=doc-choice]'))builder.docs=$$('[name=doc-choice]:checked').map(e=>e.value);$$('[data-row-topic]').forEach(e=>builder.rows[Number(e.dataset.rowTopic)].topic=e.value);state.builderDraft=structuredClone(builder);persist()}

function generate(){if(generating)return;closeModal();generating=true;const b=structuredClone(builder),charge=totalCost(),source=state.source;let progress=0;openModal('Sedang menyiapkan perangkat',`<div class="loading-center"><h3 id="loading-label">Menyusun urutan pembelajaran</h3><p>${b.count} pertemuan · ${b.docs.length} jenis perangkat</p><div class="progress"><span id="generation-progress" style="width:5%"></span></div><p class="small">Simulasi akan selesai dalam beberapa detik.</p></div>`);const timer=setInterval(()=>{progress+=25;if($('#generation-progress'))$('#generation-progress').style.width=progress+'%';if($('#loading-label'))$('#loading-label').textContent=progress<50?'Menyiapkan bantuan bertingkat':progress<100?'Menyelaraskan perangkat pembelajaran':'Perangkat siap ditinjau';if(progress>=100){clearInterval(timer);if(source==='school'){state.schoolBalance-=charge;state.allocation-=charge}else state.personal-=charge;const id='plan-'+Date.now();const p={id,classId:b.classId,title:b.scope==='meeting'?b.rows[0].topic:`${scopeNames[b.scope]} · ${classBy(b.classId).subject}`,scope:b.scope,approach:b.approach,docs:b.docs,needs:b.needs,audio:b.audio,visual:b.visual,source:b.source,jp:b.jp,duration:b.duration,meetings:b.rows,created:new Date().toISOString(),reflection:b.reflection?(b.evaluationSnapshot||latestNote(b.classId)):null,evaluationId:b.evaluationId||'',evaluationSnapshot:b.evaluationSnapshot||null,previousLesson:b.previousLesson||null,differentiations:b.differentiations||['Proses'],classSnapshot:structuredClone(classBy(b.classId)),year:state.profile.year,published:false};state.plans.push(p);state.transactions.unshift({title:p.title,amount:-charge,source,date:new Date().toISOString()});state.unread=true;persist();generating=false;closeModal();selectedPlan=id;selectedMeeting=0;docType='Modul Ajar';editing=false;builder=null;state.builderDraft=null;persist();go('result');toast(`${p.meetings.length} pertemuan siap ditinjau. Saldo contoh telah diperbarui.`)}},400)}
function library(){const plans=state.plans.filter(p=>(libraryScope==='all'||p.scope===libraryScope)&&(p.title+' '+classBy(p.classId).name).toLowerCase().includes(libraryQuery.toLowerCase()));return heading('Perangkat saya','Rencana tersimpan, siap ditinjau dan disesuaikan.',btn(icon('plus')+' Buat perangkat','new','meeting','primary'))+`<div class="library-toolbar"><label class="field">Cari perangkat<input id="library-search" type="search" value="${escapeHTML(libraryQuery)}" placeholder="Cari topik atau nama kelas"></label><label class="field">Rentang<select id="library-scope"><option value="all">Semua rencana</option>${Object.entries(scopeNames).map(([k,t])=>`<option value="${k}" ${libraryScope===k?'selected':''}>${t}</option>`).join('')}</select></label></div><div id="library-results">${libraryResults(plans)}</div>`}

function docSections(p,m,type){const c=classBy(p.classId),math=c.subject==='Matematika',total=p.jp*p.duration,start=Math.max(5,Math.round(total*.15)),end=Math.max(5,Math.round(total*.15)),core=total-start-end;const analogy=math?'Bayangkan satu papan cokelat dibagi menjadi 100 petak. 0,5 berarti 50 petak, sedangkan 0,35 berarti 35 petak. Banyaknya angka di belakang koma tidak menentukan besarnya nilai.':'Pendapat seperti atap rumah; alasan dan bukti adalah penyangganya. Atap yang tampak menarik tetap membutuhkan penyangga yang kuat. Periksa apakah bukti benar-benar mendukung pendapat.';const misconception=math?'Dugaan keliru: 0,35 lebih besar daripada 0,5 karena 35 lebih besar daripada 5. Gunakan nilai tempat: 0,5 = 0,50, sehingga 0,50 > 0,35.':'Dugaan keliru: semua kalimat yang terdengar meyakinkan adalah fakta. Periksa apakah pernyataan dapat dibuktikan, dari mana sumbernya, dan apakah kalimat itu menyatakan penilaian pribadi.';const approachText={'Kelompok fleksibel':'Bentuk kelompok sementara sesuai hasil cek awal. Siswa dapat berpindah kelompok setelah menunjukkan pemahaman.','Analogi & contoh konkret':'Mulai dari benda atau situasi yang dikenal siswa. Hubungkan setiap bagian analogi dengan konsep, lalu jelaskan batas analoginya.','Belajar mandiri':'Sediakan petunjuk langkah demi langkah dan titik pemeriksaan. Guru mendampingi siswa yang membutuhkan bantuan tanpa menghentikan siswa lain.','Proyek kolaboratif':'Bagi peran pencatat, penanya, penyaji, dan pemeriksa. Setiap siswa tetap menjawab pertanyaan individu untuk menunjukkan pemahamannya.'}[p.approach];const common=[['Tujuan pembelajaran',m.objective],['Konteks pertemuan',`${m.topic}\nBab: ${m.chapter}. ${c.name}, semester ${m.semester}. Alokasi ${p.jp} JP × ${p.duration} menit (${total} menit).`]];let sections;
if(type==='Modul Ajar')sections=[...common,['Cek kesiapan awal',`Tanyakan pemahaman awal tentang ${m.topic.toLowerCase()}. Minta siswa menjelaskan satu contoh dengan kata-katanya sendiri. Gunakan jawaban ini untuk menentukan bantuan sementara, bukan memberi label kemampuan tetap.`],['Langkah pembelajaran',`Pembuka (${start} menit): hubungkan topik dengan pengalaman siswa dan cek pemahaman awal.\nKegiatan inti (${core} menit): ${approachText} Berikan latihan sesuai kebutuhan, lalu bahas alasan di balik jawaban.\nPenutup (${end} menit): siswa menjelaskan hal yang dipahami dan mengerjakan satu pertanyaan penerapan baru.`],['Bantuan: bimbingan lebih dekat',p.needs.base],['Bantuan: latihan penguatan',p.needs.middle],['Bantuan: tantangan lanjutan',p.needs.advanced],['Analogi dan miskonsepsi',`${analogy}\n\n${misconception}`],['Menilai pemahaman','Periksa ketepatan jawaban, alasan yang diberikan, dan kemampuan menerapkan pada contoh baru. Catat kebutuhan berikutnya per kompetensi. Siswa boleh menjelaskan secara lisan atau tertulis.'],['Refleksi dan pertemuan berikutnya',p.reflection?`Pengamatan guru: ${p.reflection.text}\nPenyesuaian: ${p.reflection.recommendation||'Tinjau bantuan yang diusulkan berdasarkan pengamatan ini.'}`:'Setelah mengajar, catat bagian yang belum dipahami dan bantuan yang berhasil. Perbarui rencana berikutnya berdasarkan bukti tersebut.']];
else if(type==='RPP')sections=[...common,['Pendahuluan',`Selama ${start} menit, kaitkan topik dengan kehidupan sehari-hari. Sampaikan tujuan dan ajukan satu pertanyaan untuk mengetahui kesiapan siswa.`],['Kegiatan inti',`${core} menit. ${approachText}\nBimbingan: ${p.needs.base}\nPenguatan: ${p.needs.middle}\nTantangan: ${p.needs.advanced}`],['Penutup dan asesmen',`${end} menit. Gunakan satu tugas penerapan baru, minta siswa menjelaskan alasan, lalu tentukan tindak lanjut. Jawaban yang salah menjadi bahan dukungan berikutnya.`]];
else if(type==='LKPD')sections=[['Tujuan dan petunjuk',`${m.objective}\nTopik: ${m.topic}. Kerjakan sesuai petunjuk guru. Anda boleh meminta contoh tambahan atau menjelaskan jawaban secara lisan.`],['A. Mulai dengan contoh',math?'Gambarkan 0,5 dan 0,35 pada dua petak seratus. Mana yang lebih banyak diarsir? Jelaskan.':'Baca: “Perpustakaan sekolah buka pukul 07.00. Menurut saya, perpustakaan adalah tempat paling menyenangkan.” Tandai fakta dan pendapat, lalu jelaskan.'],['B. Coba terapkan',math?'Bandingkan 0,7 dan 0,65. Jelaskan menggunakan nilai tempat. Bantuan: tulis kedua bilangan dalam perseratusan.':'Tulis satu pendapat tentang kebiasaan membaca. Tambahkan satu alasan dan contoh bukti yang perlu dicari untuk mendukungnya.'],['C. Periksa alasan',math?'Seorang teman mengatakan 0,25 lebih besar daripada 0,8 karena 25 lebih besar dari 8. Jelaskan kesalahannya dengan gambar atau kalimat.':'Seorang teman berkata “Banyak orang setuju, jadi pendapat itu pasti benar.” Jelaskan mengapa jumlah orang yang setuju belum cukup sebagai bukti.'],['D. Tantangan',math?'Buat dua bilangan desimal dengan jumlah angka di belakang koma berbeda. Susun pertanyaan perbandingan beserta alasannya.':'Buat argumen tandingan atas pendapat Anda sendiri. Bukti tambahan apa yang akan membantu memilih kesimpulan?'],['E. Refleksi siswa','Apa yang sekarang Anda pahami? Tunjukkan dengan satu contoh baru. Bagian mana yang masih perlu bantuan?'],['Panduan jawaban untuk guru',math?'A. 0,5 = 50/100 > 35/100 = 0,35. B. 0,7 = 70/100 > 65/100. C. 0,25 = 25/100 < 80/100 = 0,8; bandingkan nilai tempat. D–E. Periksa alasan dan konsistensi contoh siswa.':'A. Jam buka dapat diverifikasi; “paling menyenangkan” adalah penilaian. B–E. Periksa hubungan pendapat, alasan, dan bukti. Terima jawaban berbeda yang memiliki alasan relevan.']];

else sections=[['Apa yang akan dipelajari?',`${m.topic}\n${m.objective}`],['Mulai dari yang dekat',analogy],['Perhatikan kesalahan ini',misconception],['Pilih bantuan yang Anda butuhkan',`Dengan bimbingan: ${p.needs.base}\nLatihan bersama: ${p.needs.middle}\nTantangan: ${p.needs.advanced}`],['Tunjukkan pemahaman Anda','Jelaskan dengan kata-kata sendiri, lalu terapkan pada satu contoh baru. Bagian mana yang masih membutuhkan bantuan?']];
if(m.topic!==topicsFor(c)[0][1]&&!m.topic.startsWith(topicsFor(c)[0][1]+' · ')){const focus=`Fokus pertemuan: ${m.topic}. `;sections=sections.map(([h,t])=>[h,t]);if(type==='LKPD')sections=[['Tujuan dan petunjuk',`${m.objective}\n${focus}Gunakan sumber yang dipilih guru.`],['1. Pahami contoh',`Temukan satu contoh ${m.topic.toLowerCase()} pada sumber belajar. Jelaskan unsur pentingnya dengan kata-kata Anda.`],['2. Terapkan',`Buat contoh baru tentang ${m.topic.toLowerCase()}. Tunjukkan langkah atau alasan yang digunakan.`],['3. Periksa kesalahan',`Temukan jawaban atau penjelasan yang keliru mengenai ${m.topic.toLowerCase()}. Jelaskan perbaikannya menggunakan sumber.`],['4. Tantangan lanjutan',`Bandingkan dua cara memahami ${m.topic.toLowerCase()}. Kapan masing-masing cara berguna?`],['5. Refleksi','Bagian mana yang sudah dipahami? Berikan bukti melalui satu contoh berbeda.'],['Panduan penilaian guru','Contoh harus sesuai topik dan sumber. Nilai ketepatan, kejelasan alasan, serta kemampuan menerapkan. Lengkapi kunci spesifik setelah memeriksa materi sumber.']];else sections=sections.map(([h,t])=>h.includes('Analogi')||h==='Mulai dari yang dekat'?[h,`Untuk ${m.topic.toLowerCase()}, pilih situasi sehari-hari yang sepadan. Jelaskan bagian yang sesuai dan bagian yang tidak dapat disamakan. Guru perlu melengkapi contoh spesifik dari buku sumber.`]:h==='Perhatikan kesalahan ini'?[h,`Kumpulkan satu jawaban yang sering keliru pada topik ${m.topic.toLowerCase()}. Minta siswa menjelaskan alasannya sebelum guru menunjukkan koreksi.`]:h==='Versi dasar'?[h,`${focus}Baca contoh dari sumber, pecah menjadi langkah pendek, lalu jelaskan ulang. ${p.needs.base}`]:h==='Versi menengah'?[h,`${focus}Bandingkan dua contoh pada sumber belajar dan jelaskan persamaannya. ${p.needs.middle}`]:h==='Panduan visual'?[h,`Susun peta konsep tentang ${m.topic.toLowerCase()} dari sumber guru. Hubungkan istilah, contoh, dan hubungan utamanya.`]:h==='Ringkasan untuk dibacakan'?[h,`${focus}${m.objective} Temukan satu contoh pada sumber, jelaskan, lalu coba contoh berbeda.`]:[h,t]);}
if(type==='LKPD')sections.splice(sections.length-1,0,['Pilihan bantuan dan tantangan',`Bimbingan lebih dekat: ${p.needs.base}\nLatihan penguatan: ${p.needs.middle}\nTantangan lanjutan: ${p.needs.advanced}\nGuru dapat memindahkan siswa sesuai pemahaman yang terlihat.`]);

ssId).name)} · Pertemuan ${m.number} · ${p.jp*p.duration} menit<br>Sumber: ${escapeHTML(p.source)} · ${pill(p.published?'Siap digunakan':'Draf untuk ditinjau',p.published?'green':'blue')}</div>${docType==='PPT'?slideView(p,m):docSections(p,m,docType).map((s,i)=>`<section class="doc-section"><h3>${escapeHTML(s.title)}</h3>${editing?`<textarea class="doc-edit" aria-label="${escapeHTML(s.title)}" data-doc-edit="${i}">${escapeHTML(s.text)}</textarea>`:`<p>${escapeHTML(s.text)}</p>`}</section>`).join('')}<div class="notice" style="margin-top:24px">${icon('info')}<span>Contoh draf pembelajaran. Tinjau tujuan, kegiatan, dan jawaban dengan buku yang digunakan. Rencana semester/tahun memerlukan pengayaan materi spesifik oleh guru.</span></div></article><section class="panel" style="margin-top:20px"><div class="row between wrap"><div><h3>Sudah digunakan di kelas?</h3><p class="small muted" style="margin-top:5px">Ceritakan yang berhasil dan yang masih perlu dibantu.</p></div>${btn(icon('mic')+' Isi refleksi','reflect-plan')}</div></section></div></div>`}

function reflection(){const c=activeClass();return heading('Catatan pembelajaran','Cerita singkat hari ini membantu pembelajaran berikutnya.')+`<div class="builder-layout"><section class="panel"><form id="reflection-form"><label class="field">Kelas<select id="reflection-class">${state.classes.map(cl=>`<option value="${cl.id}" ${cl.id===c.id?'selected':''}>${escapeHTML(cl.name)} · ${escapeHTML(cl.subject)}</option>`).join('')}</select></label><div class="divider"></div><h2>Bagaimana pembelajaran tadi?</h2><p class="lead" style="margin-bottom:16px">Ceritakan kegiatan yang berhasil, kesulitan siswa, dan bantuan yang dibutuhkan.</p><label class="field"><span>Cerita Anda</span><textarea id="reflection-text" required maxlength="3000" placeholder="Contoh: Siswa sudah bisa membandingkan desimal dengan gambar, tetapi masih bingung tanpa bantuan gambar." style="min-height:150px">${escapeHTML(reflectionDraft.text)}</textarea></label><div class="row wrap" style="margin-top:12px">${btn(icon('mic')+' Ucapkan dengan suara','voice')}${btn('Gunakan contoh cerita','sample-reflection','','text')}</div><p id="voice-status" role="status" class="field-note">Teks suara dapat Anda periksa dan sunting sebelum disimpan.</p><div class="divider"></div><h3>Kondisi yang terlihat</h3><div class="template-chips">${['Materi masih abstrak','Waktu kurang','Partisipasi rendah','Kelas kurang kondusif'].map(t=>`<button type="button" class="chip" data-action="difficulty" data-value="${t}" aria-pressed="${reflectionDraft.difficulty.includes(t)}">${t}</button>`).join('')}</div><div class="form-grid" style="margin-top:22px"><label class="field">Kecepatan belajar<select id="reflection-pace">${['Lebih lambat','Sesuai rencana','Lebih cepat'].map(t=>`<option ${reflectionDraft.pace===t?'selected':''}>${t}</option>`).join('')}</select></label><label class="field">Tujuan pembelajaran<select id="reflection-goal">${['Belum terlihat','Sebagian','Mayoritas tercapai'].map(t=>`<option ${reflectionDraft.goal===t?'selected':''}>${t}</option>`).join('')}</select></label></div><p class="field-note">Ini pengamatan guru tentang pertemuan, bukan nilai asesmen tiap siswa.</p><div class="form-footer"><span class="small muted">Dapat disunting sebelum digunakan.</span><button class="btn primary" type="submit">Lihat penyesuaian ${icon('arrow')}</button></div></form>${reflectionDraft.recommendation?`<div class="divider"></div><h3>Usulan untuk pertemuan berikutnya</h3><div class="notice good" style="margin:14px 0">${icon('check')}<span>${escapeHTML(reflectionDraft.recommendation)}</span></div><div class="row wrap">${btn('Simpan refleksi','save-reflection','','primary')}${btn('Simpan & siapkan pertemuan','reflection-build')}</div>`:''}</section><aside class="stack"><section class="panel"><h3>Refleksi yang berguna</h3><p class="lead small">“Siswa belum paham” akan lebih membantu jika dilengkapi:</p><div class="divider"></div><p class="small"><strong>Materi apa?</strong><br><span class="muted">Misalnya, membandingkan dua desimal.</span></p><p class="small" style="margin-top:15px"><strong>Bantuan apa yang sudah dicoba?</strong><br><span class="muted">Gambar, contoh konkret, atau diskusi.</span></p><p class="small" style="margin-top:15px"><strong>Apa yang berubah?</strong><br><span class="muted">Siswa dapat menjelaskan dengan contoh baru.</span></p></section><section class="panel"><h3>Catatan kelas ini</h3>${classNotes(c.id).slice(0,5).map(r=>`<div class="divider"></div><p class="small muted">${new Date(r.date).toLocaleDateString('id-ID')}</p><p style="font-size:13px;margin-top:8px">${escapeHTML(r.text)}</p>`).join('')||'<p class="lead small">Refleksi yang Anda simpan akan muncul di sini.</p>'}</section></aside></div>`}
function syncReflection(){if($('#reflection-text'))reflectionDraft.text=$('#reflection-text').value;if($('#reflection-pace'))reflectionDraft.pace=$('#reflection-pace').value;if($('#reflection-goal'))reflectionDraft.goal=$('#reflection-goal').value}
function reflectionRecommendation(){const d=reflectionDraft.difficulty;let out=[];if(d.includes('Materi masih abstrak'))out.push('Mulai dengan contoh konkret dan gambar sebelum simbol atau istilah.');if(d.includes('Waktu kurang'))out.push('Kurangi jumlah latihan utama dan sediakan tugas tambahan sebagai pilihan.');if(d.includes('Partisipasi rendah'))out.push('Beri waktu berpikir individu, lalu diskusi berpasangan sebelum berbagi ke kelas.');if(d.includes('Kelas kurang kondusif'))out.push('Gunakan kelompok kecil dengan peran yang jelas dan jeda pemeriksaan singkat.');if(reflectionDraft.pace==='Lebih lambat'||reflectionDraft.goal==='Belum terlihat')out.push('Ulangi konsep inti dengan bantuan bertahap sebelum beralih topik.');else if(reflectionDraft.pace==='Lebih cepat')out.push('Tambahkan tantangan penerapan pada situasi baru bagi siswa yang siap.');else out.push('Pertahankan tujuan, siapkan latihan penguatan dan tantangan berbeda berdasarkan cek awal.');return out.join(' ')}
function saveReflection(build=false){syncReflection();if(!reflectionDraft.text.trim()){toast('Tuliskan cerita kelas terlebih dahulu.');return}const r=saveClassNote({...structuredClone(reflectionDraft),classId:state.activeClass,recommendation:reflectionDraft.recommendation||reflectionRecommendation(),sample:state.entryMode==='demo'});reflectionDraft={text:'',difficulty:[],pace:'Sesuai rencana',goal:'Sebagian',recommendation:''};toast('Catatan kelas tersimpan. Prama dan perangkat berikutnya memakai catatan yang sama.');if(build){quickPrepare(state.activeClass)}else render()}
function materials(){const c=activeClass(),t=topicsFor(c)[0],n=needsFor(c);const texts=c.subject==='Matematika'?{Dasar:'0,5 sama dengan 50 dari 100 bagian. 0,35 sama dengan 35 dari 100 bagian. Karena 50 bagian lebih banyak daripada 35 bagian, 0,5 lebih besar daripada 0,35.',Menengah:'Bandingkan desimal menggunakan nilai tempat. Samakan jumlah angka desimal tanpa mengubah nilai: 0,5 = 0,50. Bandingkan 50 perseratusan dengan 35 perseratusan. Jadi 0,50 > 0,35.',Mahir:'Jelaskan mengapa penambahan nol di akhir bagian desimal tidak mengubah nilai. Gunakan argumen ini untuk menguji pernyataan bahwa desimal dengan lebih banyak angka selalu lebih besar. Buat contoh tandingan.'}:{Dasar:'Fakta dapat diperiksa kebenarannya. Pendapat menyampaikan penilaian. “Perpustakaan buka pukul tujuh” dapat diperiksa pada jadwal. “Perpustakaan adalah tempat paling nyaman” merupakan pendapat.',Menengah:'Untuk membedakan fakta dan pendapat, periksa apakah pernyataan dapat diverifikasi dan apakah mengandung penilaian. Pendapat menjadi lebih kuat ketika didukung fakta yang relevan dan sumber yang jelas.',Mahir:'Nilailah hubungan antara pendapat, alasan, dan bukti. Fakta yang benar belum tentu relevan sebagai dukungan. Susun argumen tandingan dan jelaskan bukti tambahan yang diperlukan.'};return heading('Materi & PPT','Berikan cara mengakses materi yang lebih beragam.')+`<div class="panel"><div class="row between wrap"><label class="field" style="min-width:220px">Kelas<select id="material-class">${state.classes.map(cl=>`<option value="${cl.id}" ${c.id===cl.id?'selected':''}>${escapeHTML(cl.name)} · ${escapeHTML(cl.subject)}</option>`).join('')}</select></label>${pill('Contoh materi','blue')}</div><div class="divider"></div><h2>${escapeHTML(t[1])}</h2><p class="lead">Tiga tingkat kedalaman untuk topik yang sama. Siswa dapat berpindah sesuai kebutuhannya.</p><div class="tabs" style="margin-top:20px" aria-label="Tingkat materi">${['Dasar','Menengah','Mahir'].map(l=>`<button class="${l===materialLevel?'active':''}" data-action="material-level" data-value="${l}" aria-pressed="${l===materialLevel}">${l}</button>`).join('')}</div><div class="diff-summary" style="border:0;padding:0"><div><h3>${materialLevel}: ${materialLevel==='Dasar'?'mulai dari contoh':materialLevel==='Menengah'?'hubungkan dan terapkan':'uji dan jelaskan'}</h3><p id="material-text" style="font-size:16px;line-height:1.9">${texts[materialLevel]}</p><div class="row wrap" style="margin-top:20px">${btn(icon('play')+' Dengarkan','speak')}${btn('Hentikan audio','stop-speak')}</div><p class="field-note" id="audio-status" role="status">Audio menggunakan suara yang tersedia pada perangkat.</p></div><div class="panel" style="background:var(--bg)"><h3>Panduan visual</h3>${c.subject==='Matematika'?`<div style="display:flex;gap:20px;margin-top:20px;flex-wrap:wrap">${[50,35].map(v=>`<figure style="margin:0"><div style="display:grid;grid-template-columns:repeat(10,8px);gap:2px" role="img" aria-label="${v} dari 100 petak diarsir">${Array.from({length:100},(_,i)=>`<span style="height:8px;background:${i<v?'var(--primary)':'var(--line)'}"></span>`).join('')}</div><figcaption class="small" style="margin-top:10px">${v} / 100 = 0,${v===50?'5':'35'}</figcaption></figure>`).join('')}</div>`:`<div class="stack" style="gap:12px;margin-top:18px">${['Pendapat: apa yang diyakini?','Alasan: mengapa demikian?','Bukti: apa yang mendukung?'].map(x=>`<div class="notice">${x}</div>`).join('')}</div>`}<p class="small muted" style="margin-top:15px">${n[materialLevel==='Dasar'?'base':materialLevel==='Menengah'?'middle':'advanced']}</p></div></div><div class="divider"></div><div class="row between wrap"><div><h3>Jadikan bagian dari perangkat ajar</h3><p class="small muted">Pilih materi dan PPT saat menyiapkan pembelajaran.</p></div>${btn('Siapkan materi & PPT','material-build','','primary')}</div></div>`}
function wallet(){return heading('PramuKoin','Satu akun guru, dua sumber saldo yang terpisah.')+`<div class="wallet-grid"><section class="panel"><div class="row between"><h2>Saldo pribadi</h2>${pill('Untuk guru mandiri','blue')}</div><div class="balance">${num(state.personal)} <span class="coin">P</span></div><p>Anda dapat memulai sendiri, tanpa menunggu sekolah berlangganan.</p><div class="row wrap" style="margin-top:24px">${btn('Tambah saldo demo','topup','','primary')}${btn(state.source==='personal'?'Sedang digunakan':'Gunakan saldo pribadi','source','personal')}</div></section><section class="panel"><div class="row between"><h2>Saldo sekolah</h2>${pill(state.schoolConnected?'Terhubung':'Belum terhubung',state.schoolConnected?'green':'')}</div>${state.schoolConnected?`<div class="balance">${num(state.allocation)} <span class="coin">P</span></div><p>Alokasi Anda dari saldo bersama sekolah.</p><div class="divider"></div><div class="row between small"><span class="muted">Saldo bersama tersedia</span><strong>${num(state.schoolBalance)} / 10.000</strong></div><p class="field-note">Contoh paket sekolah 10.000 koin. Pembagian per guru diatur admin sekolah.</p><div style="margin-top:20px">${btn(state.source==='school'?'Sedang digunakan':'Gunakan saldo sekolah','source','school','primary')}</div>`:`<p style="margin:24px 0">Sekolah dapat membagikan saldo kepada guru yang bergabung. Perangkat pribadi Anda tetap tersimpan.</p>${btn('Coba akses sekolah','connect-school','','primary')}<p class="field-note">Simulasi: saldo bersama 10.000 koin, alokasi Anda 2.000 koin.</p>`}</section></div><section class="panel" style="margin-top:24px"><div class="section-head"><h2>Riwayat penggunaan</h2>${pill('Transaksi contoh')}</div>${state.transactions.length?`<div class="table-wrap"><table><thead><tr><th>Kegiatan</th><th>Sumber</th><th>PramuKoin</th></tr></thead><tbody>${state.transactions.map(t=>`<tr><td>${escapeHTML(t.title)}<br><span class="small muted">${new Date(t.date).toLocaleDateSt rowser ini akan dihapus.</p>${btn('Mulai ulang demo','reset','','danger full')}</section></aside></div>`}

function setupView(){if(!setupDraft){setupDraft={...structuredClone(state.profile),className:state.profile.level==='SMP'?'VIII-B':'V-A',subject:state.profile.level==='SMP'?'Bahasa Indonesia':'Matematika',grade:state.profile.level==='SMP'?8:5,meetings:36,jp:2,duration:state.profile.level==='SMP'?40:35,days:state.profile.level==='SMP'?['Selasa','Jumat']:['Senin','Kamis'],schoolSelected:false,hasExtraClass:false,extraClassName:state.profile.level==='SMP'?'IX-A':'VI-A',extraGrade:state.profile.level==='SMP'?9:6,extraSubject:state.profile.level==='SMP'?'Bahasa Indonesia':'Matematika'}}const s=setupDraft;return `<div class="setup">${heading('Siapkan ruang mengajar Anda','Cukup di awal. Semua data dapat diperbarui kembali.') }<div class="setup-intro"><div class="row between small muted"><span>Langkah ${setupStep} dari 5</span><span>${setupStep*20}%</span></div><div class="progress" style="margin-top:10px"><span style="width:${setupStep*20}%"></span></div></div><ol class="stepper">${['Profil','Sekolah','Semester','Kelas','Periksa'].map((t,i)=>`<li class="${setupStep===i+1?'active':setupStep>i+1?'done':''}"><b>${setupStep>i+1?'✓':i+1}</b>${t}</li>`).join('')}</ol><section class="panel setup-step"><form id="setup-form">${setupStep===1?`<h2>Kenalkan diri Anda</h2><p class="lead" style="margin-bottom:20px">Nama ini akan tampil pada perangkat ajar Anda.</p><div class="form-grid"><label class="field wide">Nama lengkap<input name="name" required maxlength="80" value="${escapeHTML(s.name)}"></label><label class="field">NIP / NUPTK (opsional)<input name="nip" maxlength="30" value="${escapeHTML(s.nip)}"></label><label class="field">Telepon (opsional)<input name="phone" type="tel" maxlength="25" value="${escapeHTML(s.phone)}"></label></div>`:setupStep===2?`<h2>Di mana Anda mengajar?</h2><p class="lead" style="margin-bottom:20px">Pilih contoh sekolah atau tuliskan sekolah Anda sendiri.</p><label class="field">Nama sekolah / NPSN<input id="school-search" name="school" required value="${escapeHTML(s.school)}" maxlength="100"></label><div class="template-chips">${btn('Cari contoh sekolah','search-school','','subtle')}</div><div id="school-results"></div><div class="form-grid" style="margin-top:20px"><label class="field">Jenjang<select name="level" id="setup-level"><option ${s.level==='SD'?'selected':''}>SD</option><option ${s.level==='SMP'?'selected':''}>SMP</option></select></label><label class="field">Nama kepala sekolah<input name="principal" value="${escapeHTML(s.principal)}" maxlength="80"></label></div><p class="field-note">Pencarian demo menggunakan daftar contoh, belum terhubung ke data kementerian.</p>`:setupStep===3?`<h2>Atur periode pembelajaran</h2><p class="lead" style="margin-bottom:20px">Menjadi acuan rencana semester dan tahunan.</p><div class="form-grid"><label class="field">Tahun ajaran<input name="year" value="${escapeHTML(s.year)}" required pattern="[0-9]{4}/[0-9]{4}" title="Contoh: 2026/2027"></label><label class="field">Semester<select name="semester"><option ${s.semester==='Ganjil'?'selected':''}>Ganjil</option><option ${s.semester==='Genap'?'selected':''}>Genap</option></select></label><label class="field wide">Kurikulum<input readonly value="Kurikulum Merdeka (contoh)"></label></div>`:setupStep===4?`<h2>Tentukan kelas & mata pelajaran</h2><p class="lead" style="margin-bottom:20px">Data ini menjadi acuan rekomendasi perencanaan yang dipersonalisasi di beranda.</p><div class="form-grid"><label class="field">Nama kelas utama<input name="className" value="${escapeHTML(s.className)}" required maxlength="24"></label><label class="field">Tingkat (${s.level})<input name="grade" type="number" min="${s.level==='SD'?1:7}" max="${s.level==='SD'?6:9}" value="${s.grade}" required></label><label class="field">Mata pelajaran<select name="subject"><option ${s.subject==='Bahasa Indonesia'?'selected':''}>Bahasa Indonesia</option><option ${s.subject==='Matematika'?'selected':''}>Matematika</option></select></label><label class="field">Pertemuan per semester<input name="meetings" type="number" min="1" max="72" value="${s.meetings}" required></label><label class="field">Jumlah JP<input name="jp" type="number" min="1" max="12" value="${s.jp}" required></label><label class="field">Menit per JP<input name="duration" type="number" min="15" max="120" value="${s.duration}" required></label></div><p style="margin-top:20px">Hari mengajar kelas utama</p><div class="template-chips">${['Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'].map(d=>`<label class="check"><input type="checkbox" name="day" value="${d}" ${s.days.includes(d)?'checked':''}>${d}</label>`).join('')}</div><div style="margin-top:20px;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--surface2,#f8fafc)"><label class="check" style="font-weight:600;display:flex;align-items:center;gap:10px;cursor:pointer"><input type="checkbox" id="setup-extra-toggle" name="hasExtraClass" ${s.hasExtraClass?'checked':''}><span>Saya juga mengajar di kelas lain (misal: ${s.level==='SMP'?'Kelas 9':'Kelas 6'})</span></label><div id="setup-extra-box" style="${s.hasExtraClass?'':'display:none;'}margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)"><div class="form-grid"><label class="field">Nama kelas kedua<input name="extraClassName" value="${escapeHTML(s.extraClassName||(s.level==='SMP'?'IX-A':'VI-A'))}" maxlength="24"></label><label class="field">Tingkat kelas kedua (${s.level})<input name="extraGrade" type="number" min="${s.level==='SD'?1:7}" max="${s.level==='SD'?6:9}" value="${s.extraGrade||(s.level==='SMP'?9:6)}"></label><label class="field">Mata pelajaran kelas kedua<select name="extraSubject"><option ${(s.extraSubject||s.subject)==='Bahasa Indonesia'?'selected':''}>Bahasa Indonesia</option><option ${(s.extraSubject||s.subject)==='Matematika'?'selected':''}>Matematika</option></select></label></div></div></div><div id="setup-error"></div>`:`<h2>Sudah sesuai?</h2><p class="lead" style="margin-bottom:20px">Periksa data sebelum masuk ke ruang mengajar.</p><div class="review-grid"><div><strong>Guru</strong>${escapeHTML(s.name)}</div><div><strong>Sekolah</strong>${escapeHTML(s.school)}</div><div><strong>Periode</strong>${escapeHTML(s.year)} · ${s.semester}</div><div><strong>Kelas Utama</strong>${escapeHTML(s.className)} (Kelas ${s.grade}) · ${escapeHTML(s.subject)}</div>${s.hasExtraClass?`<div><strong>Kelas Tambahan</strong>${escapeHTML(s.extraClassName||(s.level==='SMP'?'IX-A':'VI-A'))} (Kelas ${s.extraGrade||(s.level==='SMP'?9:6)}) · ${escapeHTML(s.extraSubject||s.subject)}</div>`:''}<div><strong>Jadwal</strong>${s.days.join(', ')}<br>${s.jp} JP × ${s.duration} menit</div><div><strong>Perencanaan</strong>${s.meetings} pertemuan / semester</div></div><div class="notice" style="margin-top:20px">${icon('info')}<span>Setup tersimpan di browser ini. Rekomendasi di beranda akan otomatis dipersonalisasi sesuai kelas yang Anda ampu.</span></div>`}<div class="form-footer">${setupStep>1?btn('Kembali','setup-back'):btn(state.setupDone?'Kembali ke beranda':'Kembali ke pilihan awal',state.setupDone?'nav':'entry-back','home')}<button class="btn primary" type="submit">${setupStep===5?'Simpan & buka beranda':'Lanjut '+icon('arrow')}</button></div></form></section></div>`}
function guide(){return heading('Panduan Pramuajar','Mulai mandiri, lalu kembangkan sesuai kebutuhan Anda.')+`<section class="panel guide"><h2>Dari persiapan sampai refleksi</h2>${[
['Bagaimana memulai sebagai guru mandiri?','Pada kunjungan pertama, pilih Siapkan ruang mengajar. Isi data Anda, sekolah, semester, dan satu kelas. Guru lain tidak perlu bergabung terlebih dahulu. Anda dapat menambah kelas di Kelas saya.'],
['Bagaimana membuat perangkat satu semester atau tahun?','Pilih kartu Satu semester atau Satu tahun di beranda. Atur jumlah pertemuan, pendekatan, dan kebutuhan belajar. Tinjau serta sunting urutan topik sebelum mengonfirmasi biaya. Semua pertemuan tersedia melalui pilihan pertemuan pada hasil.'],
['Apa perbedaan saldo pribadi dan sekolah?','Saldo pribadi digunakan guru mandiri. Saldo sekolah merupakan alokasi dari saldo bersama yang diberikan sekolah. Pilih sumber sebelum pembuatan; satu transaksi hanya memakai satu sumber saldo.'],
['Bagaimana diferensiasi masuk ke perangkat?','Periksa usulan bantuan yang disiapkan dari catatan kelas: bimbingan, latihan penguatan, dan tantangan lanjutan. Rancangan Modul Ajar, RPP, materi, LKPD, dan PPT menggunakan pilihan tersebut. Kelompok bersifat sementara berdasarkan kompetensi.'],
['Bagaimana refleksi memengaruhi pembelajaran?','Tulis cerita atau gunakan suara jika perangkat mendukung. Pilih kondisi kelas dan tinjau penyesuaian. Simpan dan siapkan pertemuan berikutnya. Pengamatan guru tetap dibedakan dari hasil asesmen siswa.'],
['Bagaimana memakai Prama?','Tulis bebas tentang perangkat ajar atau kelas. Permintaan persiapan menghasilkan rencana untuk ditinjau. Cerita pembelajaran baru menjadi catatan kelas setelah Anda menyetujuinya. Prama masih simulasi terarah, bukan AI sungguhan.'],
['Apa yang bisa diunduh?','Unduh teks perangkat atau seluruh rencana sebagai berkas TXT. Cetak / PDF membuka pencetakan browser; pilih Simpan sebagai PDF. Tampilan PPT adalah pratinjau slide, belum ekspor PowerPoint.'],
['Apa batas demo ini?','Saldo dan materi adalah contoh; Anda dapat memasukkan profil serta kelas sendiri. Jangan masukkan data pribadi siswa. Pembuatan memakai contoh terstruktur di browser, belum AI atau buku resmi. Saldo tambahan tidak dibayar dan penerbitan tidak mengirim ke sekolah. Internet dibutuhkan untuk font; audio bergantung perangkat.']].map(([q,a])=>`<details><summary>${q}</summary><p>${a}</p></details>`).join('')}<div class="row wrap" style="margin-top:22px">${btn('Mulai setup guru','setup-start','','primary')}${btn('Coba buat perangkat','new','meeting')}</div></section>`}
function render(){
 route=location.hash.replace(/^#\//,'')||'home';
 document.documentElement.dataset.theme=state.theme;document.body.dataset.route=route;
 if(!state.entryMode){$('#app').innerHTML=welcomeView();document.title='Mulai · Pramuajar';return}
 if(state.entryMode==='own'&&!state.setupDone)route='setup';
 const views={home,templates:templatesView,journal:journalView,'journal-edit':journalEditorView,admin:adminView,'admin-edit':adminEditorView,classes,classroom,prama:pramaView,create:builderView,library,result,reflection,materials,wallet,profile,setup:setupView,guide};
 if(!views[route])route='home';
 $('#app').innerHTML=shell(views[route]());document.title=({home:'Beranda',classes:'Kelas saya',classroom:'Ruang kelas',prama:'Prama',create:'Siapkan perangkat',library:'Perangkat saya',result:'Hasil perangkat',reflection:'Catatan kelas',setup:'Setup awal'}[route]||'Pramuajar')+' · Ruang Guru';
}
function openMenu(open){$('.sidebar').classList.toggle('open',open);$('.screen-overlay').classList.toggle('open',open);$('.mobile-menu').setAttribute('aria-expanded',String(open));if(open)$('.sidebar a').focus();else $('.mobile-menu').focus()}
window.addEventListener('hashchange',()=>{if(recognition){recognition.stop();recognition=null}window.speechSynthesis?.cancel();render();window.scrollTo(0,0)});
document.addEventListener('keydown',e=>{if($('.sidebar.open')&&innerWidth<=760){if(e.key==='Escape'){openMenu(false);return}if(e.key==='Tab'){const a=$$('a,button', $('.sidebar')),first=a[0],last=a.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}}});
document.addEventListener('input',e=>{if(e.target.matches('[data-doc-edit]'))saveDoc();if(e.target.id==='library-search'){libraryQuery=e.target.value;$('#library-results').innerHTML=libraryResults(state.plans.filter(p=>(libraryScope==='all'||p.scope===libraryScope)&&(p.title+' '+classBy(p.classId).name).toLowerCase().includes(libraryQuery.toLowerCase())))}if(e.target.closest('#builder-form')&&!e.target.matches('[data-row-topic]')){syncBuilder();if(builderStep===1){builder.rows=null;state.builderDraft=structuredClone(builder);persist()}if($('#summary-container'))$('#summary-container').innerHTML=summaryPanel()}if(e.target.matches('[data-row-topic]'))syncBuilder();if(e.target.id==='reflection-text'){syncReflection();reflectionDraft.recommendation=''}});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='home-class'){state.activeClass=t.value;persist();render()}else if(t.id==='build-class'){const c=classBy(t.value);builder.classId=c.id;builder.needs=noteSupport(c.id);builder.jp=c.jp;builder.duration=c.duration;builder.chapter=topicsFor(c)[0][0];builder.topic=topicsFor(c)[0][1];builder.count=builder.scope==='meeting'?1:c.meetings*(builder.scope==='year'?2:1);builder.rows=null;render()}else if(t.id==='payment-source'){state.source=t.value;persist();$('#summary-container').innerHTML=summaryPanel()}else if(t.matches('[name=doc-choice]')){syncBuilder();if($('#summary-container'))$('#summary-container').innerHTML=summaryPanel()}else if(t.id==='result-meeting'){saveDoc();selectedMeeting=Number(t.value);slideIndex=0;render()}else if(t.id==='reflection-class'||t.id==='material-class'){if(t.id==='reflection-class'){syncReflection();reflectionDraft={text:'',difficulty:[],pace:'Sesuai rencana',goal:'Sebagian',recommendation:''}}state.activeClass=t.value;persist();render()}else if(t.id==='library-scope'){libraryScope=t.value;render()}else if(t.id==='class-level'){$('#class-grade').min=t.value==='SD'?1:7;$('#class-grade').max=t.value==='SD'?6:9;$('#class-grade').value=t.value==='SD'?5:8;$('#class-duration').value=t.value==='SD'?35:40}else if(t.id==='setup-level'){setupDraft.level=t.value;setupDraft.grade=t.value==='SD'?5:8;setupDraft.className=t.value==='SD'?'V-A':'VIII-B';setupDraft.duration=t.value==='SD'?35:40;setupDraft.subject=t.value==='SD'?'Matematika':'Bahasa Indonesia';setupDraft.extraClassName=t.value==='SD'?'VI-A':'IX-A';setupDraft.extraGrade=t.value==='SD'?6:9;setupDraft.extraSubject=t.value==='SD'?'Matematika':'Bahasa Indonesia'}else if(t.id==='setup-extra-toggle'){setupDraft.hasExtraClass=t.checked;const box=$('#setup-extra-box');if(box)box.style.display=t.checked?'block':'none'}else if(t.id==='reflection-pace'||t.id==='reflection-goal'){syncReflection();reflectionDraft.recommendation=''}});
document.addEventListener('submit',e=>{const f=e.target;e.preventDefault();if(f.id==='builder-form'){syncBuilder();if(builderStep===2&&!builder.docs.length){toast('Pilih minimal satu jenis perangkat.');return}if(builderStep<3){builderStep++;render();window.scrollTo(0,0)}else confirmGenerate()}else if(f.id==='class-form'){const d=new FormData(f),days=d.getAll('day');if(!days.length){$('#class-error').innerHTML='<div class="error" role="alert">Pilih setidaknya satu hari mengajar.</div>';return}const c={id:f.dataset.id||'class-'+Date.now(),name:d.get('name').trim(),school:d.get('school').trim(),level:d.get('level'),grade:d.get('grade'),subject:d.get('subject'),meetings:Number(d.get('meetings')),jp:Number(d.get('jp')),duration:Number(d.get('duration')),days};if(!c.name||!c.school){$('#class-error').innerHTML='<div class="error">Nama kelas dan sekolah perlu diisi.</div>';return}const at=state.classes.findIndex(x=>x.id===c.id);if(at>=0)state.classes[at]=c;else state.classes.push(c);persist();closeModal();render();toast('Data kelas tersimpan.')}else if(f.id==='reflection-form'){syncReflection();if(!reflectionDraft.text.trim()){toast('Ceritakan pembelajaran terlebih dahulu.');return}reflectionDraft.recommendation=reflectionRecommendation();render();$('#main').scrollIntoView({block:'end',behavior:'smooth'})}else if(f.id==='profile-form'){const d=Object.fromEntries(new FormData(f));if(!d.name.trim()||!d.school.trim()){toast('Nama dan sekolah perlu diisi.');return}state.profile={...state.profile,...d};persist();render();toast('Profil guru tersimpan.')}else if(f.id==='setup-form'){const d=new FormData(f);for(const[k,v]of d)if(k!=='day'&&k!=='hasExtraClass')setupDraft[k]=v;if(setupStep===4){setupDraft.days=d.getAll('day');setupDraft.hasExtraClass=!!f.querySelector('#setup-extra-toggle')?.checked;if(!setupDraft.days.length){$('#setup-error').innerHTML='<div class="error" role="alert">Pilih setidaknya satu hari mengajar.</div>';return}}if(setupStep<5){setupStep++;render();window.scrollTo(0,0)}else{const s=setupDraft;state.profile={name:s.name,school:s.school,principal:s.principal,year:s.year,semester:s.semester,nip:s.nip,phone:s.phone,level:s.level};if(state.initialOwnSetup){state.classes=[];state.initialOwnSetup=false}const existing=state.classes.find(c=>c.school===s.school&&c.name===s.className&&c.subject===s.subject);const cl={id:existing?.id||'class-'+Date.now(),name:s.className,school:s.school,subject:s.subject,level:s.level,grade:String(s.grade),meetings:Number(s.meetings),jp:Number(s.jp),duration:Number(s.duration),days:s.days};if(existing)Object.assign(existing,cl);else state.classes.push(cl);if(s.hasExtraClass){const extraName=s.extraClassName||(s.level==='SMP'?'IX-A':'VI-A');const extraGrade=String(s.extraGrade||(s.level==='SMP'?9:6));const extraSubject=s.extraSubject||s.subject;const existingExtra=state.classes.find(c=>c.school===s.school&&c.name===extraName&&c.subject===extraSubject);const clExtra={id:existingExtra?.id||'class-'+Date.now()+'-extra',name:extraName,school:s.school,subject:extraSubject,level:s.level,grade:extraGrade,meetings:Number(s.meetings),jp:Number(s.jp),duration:Number(s.duration),days:['Rabu','Sabtu']};if(existingExtra)Object.assign(existingExtra,clExtra);else state.classes.push(clExtra);}state.activeClass=cl.id;state.setupDone=true;persist();go('home');toast('Ruang mengajar Anda sudah siap.')}}});
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action,v=el.dataset.value;
if(a==='start-demo'){state.entryMode='demo';for(const c of state.classes){if(!classNotes(c.id).length)saveClassNote({classId:c.id,sample:true,kind:'Contoh refleksi',topic:topicsFor(c)[0][1],text:c.subject==='Matematika'?'Pada latihan desimal, beberapa siswa terbantu petak seratus tetapi masih bingung ketika gambar dihilangkan.':'Diskusi berpasangan membantu siswa memilih bukti. Beberapa siswa masih membutuhkan contoh hubungan pendapat dan bukti.'})}persist();go('home')}
else if(a==='start-own'){state.entryMode='own';state.initialOwnSetup=true;startSetup();setupDraft.name='';setupDraft.school='';setupDraft.principal='';persist();render()}
else if(a==='entry-back'){delete state.entryMode;state.initialOwnSetup=false;persist();render()}
else if(a==='quick-prepare')quickPrepare(v);
else if(a==='view-class'){state.activeClass=v;persist();go('classroom')}
else if(a==='tell-class'){state.activeClass=v;persist();startPrama(pramaContext(v),true);currentPrama().draft='Hari ini, ';go('prama')}
else if(a==='save-builder'){syncBuilder();go('home');toast('Draf tersimpan. Lanjutkan kapan saja dari beranda.')}
else if(a==='resume-draft'){builder=structuredClone(state.builderDraft);builderStep=1;go('create')}
else if(a==='nav'){if(route==='create')syncBuilder();if(route==='result')saveDoc();go(v)}
else if(a==='modal-nav'){closeModal();go(v)}
else if(a==='new')newBuilder(v);
else if(a==='template'){newBuilder('semester',Number(v));toast('Template dipilih. Tentukan kelas dan rentang rencana.');}
else if(a==='prepare-class'){state.activeClass=v;persist();newBuilder('meeting',0,v)}
else if(a==='scope'){syncBuilder();builder.scope=v;builder.count=v==='meeting'?1:classBy(builder.classId).meetings*(v==='year'?2:1);builder.rows=null;render()}
else if(a==='topic'){syncBuilder();const t=topicsFor(classBy(builder.classId))[Number(v)];builder.chapter=t[0];builder.topic=t[1];builder.rows=null;render()}
else if(a==='builder-back'){syncBuilder();builderStep--;render();window.scrollTo(0,0)}
else if(a==='close')closeModal();
else if(a==='generate')generate();
else if(a==='theme'){state.theme=state.theme==='light'?'dark':'light';persist();if(route==='create')syncBuilder();if(route==='reflection')syncReflection();render()}
else if(a==='menu')openMenu(true);else if(a==='menu-close')openMenu(false);
else if(a==='demo-info')openModal('Tentang prototipe ini','<p>Ini simulasi ruang kerja guru Pramuajar. Semua saldo, agenda, kelas awal, dan materi adalah contoh.</p><p>Anda dapat membuat dan menyunting perangkat, menyimpan refleksi, serta mencoba pembagian saldo sekolah. Data disimpan pada browser ini.</p><p>Pembuatan menggunakan contoh terstruktur, belum terhubung ke AI, sumber kurikulum resmi, pembayaran, atau akun sekolah sungguhan.</p>',btn('Saya mengerti','close','','primary'));
else if(a==='notifications'){state.unread=false;persist();openModal('Pemberitahuan',state.plans.length?`<p>Rencana terakhir Anda sudah tersedia di Perangkat saya.</p><p class="muted">${escapeHTML(state.plans.at(-1).title)}</p>`:'<p>Selamat datang. Saldo contoh 20 PramuKoin tersedia untuk mencoba perangkat pertama Anda.</p>',btn('Buka perangkat saya','modal-nav','library','primary'))}
else if(a==='prama')openPramaPanel();
else if(a==='open-plan'){selectedPlan=v;selectedMeeting=0;docType='Modul Ajar';editing=false;go('result')}
else if(a==='sample-doc')samplePlan();
else if(a==='doc-type'){saveDoc();docType=v;slideIndex=0;render()}
else if(a==='toggle-edit'){saveDoc();editing=!editing;render();if(!editing)toast('Perubahan tersimpan di perangkat ini.')}
else if(a==='slide'){saveDoc();slideIndex+=Number(v);render()}
else if(a==='download-doc'){saveDoc();const p=getPlan();download(`${docType} - ${p.meetings[selectedMeeting].topic.replace(/[^\p{L}\p{N} -]/gu,'')}.txt`,planText(p,false))}
else if(a==='download-plan'){saveDoc();const p=state.plans.find(x=>x.id===v);download(`Pramuajar - ${p.title.replace(/[^\p{L}\p{N} -]/gu,'')}.txt`,planText(p))}

 if(/sudah paham|cepat|mahir/i.test(text))return 'Periksa melalui satu masalah baru. Siswa yang sudah menguasai dapat menerima tantangan penerapan; siswa lain tetap memperoleh contoh dan bantuan bertahap.';
 return 'Mulai dari satu contoh konkret, lanjutkan latihan dengan petunjuk, lalu cek menggunakan contoh baru. Sediakan tantangan penerapan bagi yang sudah siap. Kelompok dapat berubah sesuai hasilnya.';
}
function askPrama(question){
 let t=currentPrama();const q=question.trim();if(!q)return;
 const alias=name=>name.replace(/^viii/i,'8').replace(/^vii/i,'7').replace(/^vi/i,'6').replace(/^iv/i,'4').replace(/^v/i,'5').replace(/^ix/i,'9').replace(/-/g,'').toLowerCase();
 const compact=q.toLowerCase().replace(/-/g,'');
 const named=state.classes.filter(c=>q.toLowerCase().includes(c.name.toLowerCase())||new RegExp('(?:kelas\\s+|\\b)'+alias(c.name).replace(/([a-z])$/,'\\s*$1')+'\\b','i').test(compact));
 if(named.length===1&&named[0].id!==t.classId)t=startPrama(pramaContext(named[0].id));
 const c=classBy(t.classId),sources=pramaEvidence(c.id),prior=t.messages.at(-1),m={id:crypto.randomUUID(),question:q,date:new Date().toISOString(),sources:[],summary:''};
 const requested=q.match(/\bkelas\s+([1-9]|1[0-2]|[ivx]+)\s*[- ]?\s*([a-z])\b/i);
 const key=x=>x.toLowerCase().replace(/[^a-z0-9]/g,'');
 const known=requested&&state.classes.some(cl=>key(cl.name)===key(requested[1]+requested[2])||key(cl.name.replace(/^viii/i,'8').replace(/^vii/i,'7').replace(/^vi/i,'6').replace(/^v/i,'5').replace(/^iv/i,'4'))===key(requested[1]+requested[2]));
 const hypothetical=/bagaimana jika|misal|seandainya|andaikan/i.test(q);
 const observation=!hypothetical&&/hari ini|tadi|kemarin|saya mengamati|simpan.*catatan/i.test(q);
 const create=/buat|siapkan|susun|rencana|lanjutkan/i.test(q)&&/perangkat|materi|lkpd|pembelajaran|pertemuan|semester|tahun|rencana|latihan/i.test(q);
 const revise=prior?.action?.kind==='create'&&/lebih sederhana|lebih mudah|pakai analogi|gunakan gambar|tambahkan|ubah|ganti/i.test(q);
 const p=t.planId?state.plans.find(x=>x.id===t.planId):null;
 const edit=!!p&&p.docs.includes('LKPD')&&/lkpd/i.test(q)&&/ubah|sesuai|sederhana|perbaiki/i.test(q);
 if(named.length>1){m.summary='Mari bahas satu kelas terlebih dahulu agar kebutuhan dan perangkat tidak tercampur. Pilih kelas di atas, lalu tanyakan kembali.'}
 else if(requested&&!known){m.summary='Kelas yang Anda sebut belum ada dalam daftar. Tambahkan melalui Kelas saya, atau pilih kelas yang tersedia. Saya tidak akan memakai catatan kelas lain.'}
 else if(/koin|saldo|biaya/i.test(q)){m.summary='Saldo pribadi dan alokasi sekolah terpisah. Biaya ditampilkan sebelum pembuatan disetujui. Percakapan demo ini tidak memotong PramuKoin. Tarif Prama sungguhan belum ditetapkan.'}
 else if(edit){
  const meeting=p.meetings[t.meetingIndex];m.summary='Saya menyiapkan usulan petunjuk LKPD yang lebih bertahap. Periksa sebelum mengganti bagian bantuan; bagian lain tetap tersimpan.';
  m.action={kind:'edit',classId:c.id,planId:p.id,meetingIndex:t.meetingIndex,topic:meeting.topic,number:meeting.number};m.sources=sources;
 }else if(create||revise){
  const scope=/tahun/i.test(q)?'year':/semester/i.test(q)?'semester':revise?prior.action.scope:'meeting';
  const topicMatch=q.match(/(?:topik|materi tentang|mengajar)\s+([^.!?\n]+)/i);
  let topic=topicMatch?topicMatch[1].slice(0,180):revise?prior.action.topic:t.topic;
  const found=topicsFor(c).find(x=>q.toLowerCase().includes(x[0].toLowerCase()));if(found)topic=found[1];
  const count=scope==='year'?c.meetings*2:scope==='semester'?c.meetings:1;
  m.summary=revise?'Rencana diperbarui sesuai permintaan Anda. Periksa topik dan bantuan sebelum membuat perangkat.':'Saya siapkan rancangan untuk '+c.name+'. Anda dapat mengubah urutan topik dan bantuan sebelum membuat perangkat.';
  const lastPlan=state.plans.filter(plan=>plan.classId===c.id).at(-1);
  const first=scope==='meeting'?(p?p.meetings[t.meetingIndex].number+1:lastPlan?Math.max(...lastPlan.meetings.map(row=>row.number))+1:1):1;
  m.action={kind:'create',classId:c.id,scope,count,first,topic,cost:count*3,needs:noteSupport(c.id)};
  if(revise){m.action.needs=structuredClone(prior.action.needs||noteSupport(c.id));m.action.needs.base='Gunakan satu contoh konkret dengan gambar atau analogi yang relevan. Pecah petunjuk menjadi tiga langkah pendek; periksa pemahaman setelah tiap langkah.'}
  m.sources=sources;
 }else if(observation){
  m.summary='Terima kasih sudah menceritakan pembelajaran '+c.name+'. '+pramaAdvice(q)+'\n\nIni usulan untuk dicoba, bukan kesimpulan tentang setiap siswa.';
 }else if(/kelas|belajar|bantu|siswa|lkpd|materi|perangkat|refleksi|pertemuan|karakter|ajar|pengamatan|diskusi|latihan|paham|rekomendasi/i.test(q)){
  m.sources=sources;
  m.summary=sources.length?'Catatan terbaru '+c.name+': “'+sources[0].text+'”\n\n'+pramaAdvice(sources[0].text)+'\n\nCatatan ini berlaku pada kegiatan yang diamati, bukan karakter tetap seluruh kelas.':'Belum ada catatan belajar untuk '+c.name+'. Saya belum bisa menyimpulkan kebutuhan kelas. Ceritakan topik, kesulitan yang terlihat, dan bantuan yang pernah dicoba.';
  if(hypothetical)m.summary='Untuk situasi yang Anda andaikan: '+pramaAdvice(q)+'\n\nIni saran umum, bukan catatan tentang kondisi nyata kelas Anda.';
 }else m.summary='Demo ini belum dapat menjawab pertanyaan tersebut. Coba bahas perangkat ajar, persiapan pembelajaran, atau pengamatan kelas. Jawaban saat ini menggunakan contoh terarah, bukan model AI.';
 if(observation&&!(requested&&!known)&&named.length<2)m.note={classId:c.id,text:q,topic:t.topic};
 t.messages.push(m);t.draft='';persist();refreshPrama(true);
}
function reviewNote(id){
 const t=currentPrama(),m=t.messages.find(x=>x.id===id);if(!m?.note)return;if(m.noteSaved){toast('Catatan ini sudah tersimpan di kelas.');return}
 openModal('Periksa catatan pembelajaran','<form id="prama-note-form" data-message="'+m.id+'" data-thread="'+t.id+'"><div class="stack"><label class="field">Kelas<select name="classId">'+classOptions(m.note.classId)+'</select></label><label class="field">Topik<input name="topic" maxlength="180" required value="'+escapeHTML(m.note.topic)+'"></label><label class="field">Pengamatan Anda<textarea name="text" maxlength="1600" required>'+escapeHTML(m.note.text)+'</textarea></label><p class="field-note">Sunting agar berisi pengamatan, bukan permintaan atau dugaan. Catatan dipakai bersama oleh Prama dan pembuat perangkat.</p><label class="check"><input type="checkbox" name="sample" '+(state.entryMode==='demo'?'checked':'')+'>Catatan contoh untuk demo</label><div class="row wrap">'+btn('Batal','close')+'<button class="btn primary" type="submit">Simpan catatan kelas</button></div></div></form>');
}
function lkpdSupport(p,meeting){
 const math=classBy(p.classId).subject==='Matematika',decimal=math&&/desimal/i.test(meeting.topic),argument=!math&&/argumen|pendapat|bukti/i.test(meeting.topic);
 return decimal?'Bimbingan bertahap:\n1. Siapkan dua petak seratus. Warnai 50 petak pada gambar pertama dan 35 pada gambar kedua.\n2. Tuliskan 50/100 = 0,50 = 0,5 dan 35/100 = 0,35 di bawah gambar.\n3. Lingkari jumlah yang lebih besar. Lengkapi: 0,5 … 0,35 karena ….\n\nLatihan penguatan:\nBandingkan 0,6 dan 0,45 dengan nilai tempat, lalu jelaskan alasan tanpa gambar.\n\nTantangan lanjutan:\nUji pernyataan “semakin banyak angka di belakang koma, semakin besar nilainya”. Buat dua contoh tandingan dan jelaskan.\n\nCek bersama guru:\nGunakan pasangan 0,4 dan 0,38 sebagai soal baru. Ubah bantuan berdasarkan jawaban, bukan label siswa.':argument?'Bimbingan bertahap:\n1. Baca satu paragraf pendek dari sumber yang telah diperiksa guru.\n2. Garisbawahi satu pendapat. Lingkari bukti yang mendukungnya.\n3. Lengkapi: “Bukti ini mendukung pendapat karena …”.\n\nLatihan penguatan:\nPilih satu bukti yang kurang relevan. Jelaskan mengapa, lalu usulkan penggantinya.\n\nTantangan lanjutan:\nSusun pendapat tandingan dan tentukan bukti tambahan yang diperlukan.\n\nCek bersama guru:\nGunakan paragraf baru untuk memeriksa apakah alasan dapat dijelaskan secara mandiri.':'Bimbingan bertahap untuk '+meeting.topic+':\n1. Guru menunjukkan satu contoh yang sesuai dengan buku sumber.\n2. Siswa mengerjakan contoh serupa dengan petunjuk singkat.\n3. Siswa menjelaskan alasan dengan kata-katanya sendiri.\n\nLatihan penguatan:\nTerapkan konsep pada contoh baru tanpa menyalin contoh guru.\n\nTantangan lanjutan:\nBuat contoh dan bukan contoh, lalu jelaskan perbedaannya.\n\nGuru perlu melengkapi contoh spesifik sebelum digunakan.';
}
function reviewPramaAction(id){
 const m=currentPrama().messages.find(x=>x.id===id),a=m?.action;if(!a)return;
 if(a.kind==='edit'){
  const p=state.plans.find(x=>x.id===a.planId&&x.classId===a.classId),meeting=p?.meetings[a.meetingIndex];if(!meeting){toast('Perangkat tidak ditemukan.');return}
  const sections=docSections(p,meeting,'LKPD'),index=sections.findIndex(x=>x.title==='Pilihan bantuan dan tantangan');if(index<0)return;
  pramaReview={...a,index,before:sections[index].text};
  openModal('Tinjau perubahan LKPD','<p>'+escapeHTML(classBy(a.classId).name+' · '+meeting.topic)+'</p><details class="simple-details"><summary>Lihat isi sebelumnya</summary><p style="white-space:pre-wrap">'+escapeHTML(sections[index].text)+'</p></details><form id="prama-edit-form"><label class="field">Usulan pengganti bagian bantuan<textarea name="text" required maxlength="5000" style="min-height:280px">'+escapeHTML(lkpdSupport(p,meeting))+'</textarea></label><p class="field-note">Hanya bagian bantuan LKPD pertemuan ini yang diganti. Bagian lain tidak berubah.</p><div class="row wrap" style="margin-top:16px">'+btn('Batal','close')+'<button type="submit" class="btn primary">Terapkan perubahan</button></div></form>');
 }else{
  const proceed=()=>{
   if(pramaPanel.open)closePramaPanel();state.activeClass=a.classId;newBuilder(a.scope,0,a.classId);
   builder.topic=a.topic;builder.count=a.count;builder.first=a.first||1;builder.needs=structuredClone(a.needs);builder.docs=PramuCore.aiDocumentTypes(a.scope);builder.rows=null;buildRows();builderStep=3;state.builderDraft=structuredClone(builder);persist();render();
  };
  if(builder){pramaReview={proceed};openModal('Ganti rancangan yang sedang disiapkan?','<p>Rancangan belum dibuat yang tersimpan di beranda akan diganti dengan usulan Prama. Perangkat yang sudah dibuat tetap tersimpan.</p>',btn('Batal','close')+btn('Ganti & tinjau rencana','prama-replace','','primary'))}else proceed();
 }
}
document.addEventListener('input',e=>{if(e.target.matches('[data-prama-draft]')){currentPrama().draft=e.target.value;persist()}});
document.addEventListener('change',e=>{
 if(e.target.matches('[data-prama-class]')){startPrama(pramaContext(e.target.value));refreshPrama()}
 if(e.target.matches('[data-prama-history]')){pramaStore().active=e.target.value;persist();refreshPrama()}
});
document.addEventListener('submit',e=>{
 const f=e.target;
 if(f.id==='home-prama-form'){startPrama(pramaContext(state.activeClass));go('prama');askPrama(new FormData(f).get('question'))}
 if(f.id==='prama-chat-form')askPrama(new FormData(f).get('question'));
 if(f.id==='prama-note-form'){
  const t=pramaStore().threads.find(x=>x.id===f.dataset.thread),m=t?.messages.find(x=>x.id===f.dataset.message),d=new FormData(f);if(!m||m.noteSaved)return;
  const text=d.get('text').trim();if(!text){toast('Tuliskan pengamatan Anda.');return}
  saveClassNote({classId:d.get('classId'),topic:d.get('topic').trim(),text,sample:d.has('sample'),kind:'Pengamatan guru melalui Prama'});m.noteSaved=true;if(m.action?.classId===d.get('classId')){m.action.needs=noteSupport(d.get('classId'));m.sources=pramaEvidence(d.get('classId'))}persist();closeModal();refreshPrama();toast('Catatan tersimpan. Prama dan perangkat berikutnya memakai sumber yang sama.');
 }
 if(f.id==='prama-edit-form'){
  const a=pramaReview,p=state.plans.find(x=>x.id===a?.planId),meeting=p?.meetings[a.meetingIndex],text=new FormData(f).get('text').trim();if(!meeting||!text)return;
  meeting.notes||={};meeting.notes.LKPD||={};meeting.revisions||=[];meeting.revisions.push({type:'LKPD',index:a.index,before:a.before,date:new Date().toISOString()});meeting.notes.LKPD[a.index]=text;p.published=false;
  selectedPlan=p.id;selectedMeeting=a.meetingIndex;docType='LKPD';editing=false;persist();closeModal();if(pramaPanel.open)closePramaPanel();go('result');render();toast('Bagian bantuan LKPD diperbarui. Perangkat kembali menjadi draf.');
 }
});
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action,v=el.dataset.value;
 if(a==='prama-class')openPramaPanel(v);
 else if(a==='prama-close')closePramaPanel();
 else if(a==='prama-full'){closePramaPanel();go('prama')}
 else if(a==='prama-new')newPramaConversation();
 else if(a==='prama-prompt')askPrama(v);
 else if(a==='prama-note')reviewNote(v);
 else if(a==='prama-action')reviewPramaAction(v);
 else if(a==='prama-replace'){const proceed=pramaReview?.proceed;closeModal();if(proceed)proceed();pramaReview=null}
 else if(a==='prama-voice'){
  const root=pramaPanel.open?pramaPanel:$('#main'),status=root.querySelector('[data-prama-status]'),input=root.querySelector('[data-prama-draft]'),Speech=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!Speech){status.textContent='Pengenalan suara tidak tersedia. Anda tetap dapat mengetik.';return}
  if(recognition){recognition.stop();recognition=null;return}
  const thread=currentPrama();recognition=new Speech();recognition.lang='id-ID';recognition.interimResults=false;
  recognition.onresult=ev=>{thread.draft=(thread.draft?thread.draft+' ':'')+ev.results[0][0].transcript;persist();if(input.isConnected)input.value=thread.draft};
  recognition.onerror=()=>{if(status.isConnected)status.textContent='Suara tidak dapat digunakan. Periksa izin mikrofon atau ketik pesan.';recognition=null};
  recognition.onend=()=>{recognition=null;if(status.isConnected&&!status.textContent.includes('tidak'))status.textContent='Periksa hasil suara sebelum mengirim.'};
  try{recognition.start();status.textContent='Mendengarkan… Tekan Ucapkan lagi untuk berhenti.'}catch{recognition=null;status.textContent='Suara tidak dapat dimulai. Silakan ketik pesan.'}
 }
});
